name: Wave 6 - Enterprise Authority Governance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  wave6-governance:
    runs-on: ubuntu-latest
    name: Wave 6 Governance Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Configure SQLite for CI
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          touch database/database.sqlite

      # ── Wave 6 Readiness ──────────────────────────────────────────────────
      - name: Run Wave 6 Readiness Check
        run: php artisan architecture:wave6-readiness --json > wave6-report.json

      - name: Upload Wave 6 Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave6-readiness-report
          path: wave6-report.json

      - name: Check Readiness Score
        run: |
          SCORE=$(jq -r '.overall_status.readiness_score' wave6-report.json)
          READY=$(jq -r '.overall_status.ready' wave6-report.json)
          echo "Wave 6 Readiness Score: $SCORE/100"
          echo "Wave 6 Ready: $READY"
          if [ "$SCORE" -lt 70 ]; then
            echo "❌ Readiness score below threshold (70)"
            exit 1
          fi
          if [ "$READY" != "true" ]; then
            BLOCKERS=$(jq -r '.overall_status.blockers | join(", ")' wave6-report.json)
            echo "❌ Wave 6 has blockers: $BLOCKERS"
            exit 1
          fi
          echo "✅ Readiness score acceptable"

      # ── Platform Authority Isolation ──────────────────────────────────────
      - name: Validate Platform Authority Isolation
        run: |
          echo "Validating platform authority isolation..."
          # Platform controllers must not use implicit web guard
          if grep -rn "Auth::shouldUse('web')" app/Http/Controllers/Api/Platform/ 2>/dev/null; then
            echo "❌ Platform controllers must not use implicit web guard"
            exit 1
          fi
          echo "✅ No implicit web guard usage in platform controllers"

          # Platform routes must have platform.authority middleware
          if ! grep -q "platform.authority" routes/api.php; then
            echo "❌ Platform routes must use platform.authority middleware"
            exit 1
          fi
          echo "✅ Platform authority middleware present in route definitions"

          # Support routes must have support.authority middleware
          if ! grep -q "support.authority" routes/api.php; then
            echo "❌ Support routes must use support.authority middleware"
            exit 1
          fi
          echo "✅ Support authority middleware present in route definitions"

      # ── Impersonation Audit Hooks ─────────────────────────────────────────
      - name: Validate Impersonation Audit Hooks
        run: |
          echo "Validating impersonation audit hooks..."
          if ! grep -rq "ImpersonationTelemetry" app/Services/Platform/Impersonation/; then
            echo "❌ Impersonation must have audit hooks (ImpersonationTelemetry)"
            exit 1
          fi
          echo "✅ Impersonation telemetry present"

          # Impersonation lifecycle manager must use telemetry
          if ! grep -q "impersonationTelemetry" app/Services/Platform/Impersonation/ImpersonationLifecycleManager.php; then
            echo "❌ ImpersonationLifecycleManager must emit telemetry"
            exit 1
          fi
          echo "✅ ImpersonationLifecycleManager emits telemetry"

          # Impersonation migration must exist
          if ! ls database/migrations/*create_impersonations_table* >/dev/null 2>&1; then
            echo "❌ Impersonation migration missing"
            exit 1
          fi
          echo "✅ Impersonation migration exists"

      # ── Provider Governance ───────────────────────────────────────────────
      - name: Validate Provider Governance
        run: |
          echo "Validating provider governance..."
          if ! grep -rq "ProviderGovernanceService" app/Services/Auth/; then
            echo "❌ Provider governance service required"
            exit 1
          fi
          echo "✅ Provider governance service present"

          # Provider split must NOT be activated
          if grep -rq "IdentityProviderEnum::MERCHANT\b" app/Services/Auth/ProviderGovernanceService.php 2>/dev/null | grep -v "Future"; then
            echo "❌ Provider split must not be activated in Wave 6"
            exit 1
          fi
          echo "✅ Provider split not activated (preparation only)"

      # ── Authorization Ownership ───────────────────────────────────────────
      - name: Validate Authorization Ownership Metadata
        run: |
          echo "Validating authorization ownership metadata..."
          if ! grep -rq "PolicyOwnershipRegistry" app/Services/Authorization/; then
            echo "❌ Policy ownership registry required"
            exit 1
          fi
          echo "✅ Policy ownership registry present"

          # Registry must be populated in service provider
          if ! grep -q "PolicyOwnershipRegistry" app/Providers/AppServiceProvider.php; then
            echo "❌ PolicyOwnershipRegistry must be registered in AppServiceProvider"
            exit 1
          fi
          echo "✅ PolicyOwnershipRegistry registered in AppServiceProvider"

      # ── Wave 5 Isolation Preservation ────────────────────────────────────
      - name: Validate Wave 5 Isolation Preserved
        run: |
          echo "Validating Wave 5 isolation is preserved..."

          # Contamination detection must still exist
          if ! grep -q "logSessionContamination" app/Http/Middleware/ApplyIdentityRouteContext.php; then
            echo "❌ Contamination detection removed from ApplyIdentityRouteContext"
            exit 1
          fi
          echo "✅ Contamination detection preserved"

          # Rollback feature flags must exist
          if ! grep -q "auth.guard_split.enabled" config/features.php; then
            echo "❌ Wave 5 rollback feature flags missing"
            exit 1
          fi
          echo "✅ Wave 5 rollback feature flags present"

          # Wave 6 platform flags must exist
          if ! grep -q "platform.authority.enabled" config/features.php; then
            echo "❌ Wave 6 platform authority feature flags missing"
            exit 1
          fi
          echo "✅ Wave 6 platform authority feature flags present"

      # ── Enterprise Membership Vocabulary ─────────────────────────────────
      - name: Validate Enterprise Membership Vocabulary
        run: |
          echo "Validating enterprise membership vocabulary..."
          if ! test -f app/Enums/Enterprise/MembershipLifecycleEnum.php; then
            echo "❌ MembershipLifecycleEnum missing"
            exit 1
          fi
          echo "✅ MembershipLifecycleEnum present"

          if ! test -f app/Enums/Enterprise/OwnershipSemanticEnum.php; then
            echo "❌ OwnershipSemanticEnum missing"
            exit 1
          fi
          echo "✅ OwnershipSemanticEnum present"

          # Complex inheritance must NOT be activated
          if grep -q "canInheritAuthority.*true" app/Services/Enterprise/AuthorityInheritanceModel.php 2>/dev/null; then
            echo "❌ Authority inheritance must not be activated in Wave 6"
            exit 1
          fi
          echo "✅ Authority inheritance not activated (preparation only)"

      # ── Multi-Session Governance ──────────────────────────────────────────
      - name: Validate Multi-Session Governance
        run: |
          echo "Validating multi-session governance..."
          if ! test -f app/Services/Auth/MultiSessionGovernanceService.php; then
            echo "❌ MultiSessionGovernanceService missing"
            exit 1
          fi
          echo "✅ MultiSessionGovernanceService present"

          if ! test -f app/Services/Auth/SessionLineageTracker.php; then
            echo "❌ SessionLineageTracker missing"
            exit 1
          fi
          echo "✅ SessionLineageTracker present"

      # ── Documentation Completeness ────────────────────────────────────────
      - name: Validate Wave 6 Documentation
        run: |
          echo "Validating Wave 6 documentation..."
          DOCS=(
            "docs/wave6/platform-authority-topology.md"
            "docs/wave6/support-actor-governance.md"
            "docs/wave6/impersonation-governance-model.md"
            "docs/wave6/provider-separation-readiness.md"
            "docs/wave6/enterprise-membership-authority-model.md"
            "docs/wave6/transitional-authority-reduction.md"
            "docs/wave6/multi-session-governance.md"
            "docs/wave6/authorization-ownership-registry.md"
            "docs/wave6/wave6-enterprise-authority-foundations.md"
            "docs/wave6/draft-customer-provider-cutover.md"
            "docs/wave6/draft-enterprise-org-hierarchy.md"
            "docs/wave6/draft-cross-tenant-support-governance.md"
            "docs/wave6/draft-device-trust-governance.md"
            "docs/wave6/draft-session-lineage-model.md"
            "docs/wave6/draft-global-platform-operator-model.md"
          )
          MISSING=0
          for doc in "${DOCS[@]}"; do
            if ! test -f "$doc"; then
              echo "❌ Missing: $doc"
              MISSING=$((MISSING+1))
            else
              echo "✅ $doc"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ $MISSING documentation file(s) missing"
            exit 1
          fi
          echo "✅ All Wave 6 documentation present"

      # ── Generate All Artifacts ────────────────────────────────────────────
      - name: Generate Wave 6 Artifacts
        run: php artisan architecture:wave6-artifacts

      - name: Upload Wave 6 Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave6-architecture-artifacts
          path: storage/app/architecture/
