services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: justshop-backend-api
    container_name: justshop-api-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - storefront-uploads:/var/www/storage/app/public
    env_file:
      - .env
    networks:
      - justshop-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: justshop-api-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - storefront-uploads:/var/www/public/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - justshop-network

  db:
    image: mysql:8.0
    container_name: justshop-api-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - justshop-network

  redis:
    image: redis:alpine
    container_name: justshop-api-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - justshop-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: justshop-backend-api
    container_name: justshop-api-queue
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    command: php artisan queue:work redis --queue=store-bootstrap,default --sleep=3 --tries=3 --max-time=3600
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - justshop-network

networks:
  justshop-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  storefront-uploads:
